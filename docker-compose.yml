# IR-DEPI | Docker Compose Configuration
# Production-ready setup with security best practices

services:
  # Main Application Container
  ir-depi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ir-depi-app
    restart: unless-stopped
    
    # Environment variables - loaded from .env file
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    
    # Volumes for persistent data
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      # Mount .env as read-only for API keys
      - ./.env:/app/.env:ro
    
    # Network configuration
    networks:
      - ir-depi-network
    
    # Security hardening
    user: "1000:1000"
    read_only: false
    tmpfs:
      - /tmp
      - /var/tmp
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Resource limits (optional - adjust for production)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

